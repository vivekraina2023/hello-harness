apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-harness
spec:
  replicas: 2
  selector:
    matchLabels: { app: hello-harness }
  template:
    metadata:
      labels: { app: hello-harness }
    spec:
      containers:
        - name: hello-harness
          image: <+artifacts.primary.image>
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: hello-harness
spec:
  selector: { app: hello-harness }
  ports: [{ port: 80, targetPort: 8080 }]
